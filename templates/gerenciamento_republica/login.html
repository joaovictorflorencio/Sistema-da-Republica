{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - RABBU</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'gerenciamento_republica/css/auth.css' %}" />
  </head>
  <body>
    <div class="auth-container">
      <a class="auth-back-link" href="/">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>

      <div class="brand">
        <img src="{% static 'gerenciamento_republica/assets/logo.png' %}" alt="RABBU Logo" class="logo-img" />
      </div>

      <div class="alert-box alert-error" id="globalError">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Erro</span>
      </div>
      <div class="alert-box alert-success" id="globalSuccess">
        <i class="fa-solid fa-circle-check"></i>
        <span id="successText">Sucesso</span>
      </div>

      <div id="view-login" class="form-view active">
        <p class="subtitle">Bem-vindo(a) de volta a sua casa!</p>
        <form id="loginForm">
          <div class="form-group">
            <label>E-mail</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope icon-left"></i>
              <input
                type="email"
                id="login-email"
                class="form-control"
                placeholder="seu@email.com"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock icon-left"></i>
              <input
                type="password"
                id="login-password"
                class="form-control"
                placeholder="********"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="toggleVisibility('login-password', 'login-eye')"
              >
                <i class="fa-regular fa-eye" id="login-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-main" id="btn-submit-login">
            <span>Entrar</span>
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
          </button>
        </form>
        <div class="switch-link">
          Ainda nao tem conta?
          <a href="{% url 'gerenciamento_republica:cadastro-page' %}">Criar cadastro</a>
        </div>
      </div>
    </div>
    <script>
      window.RABBU_AUTH = {
        loginUrl: "{% url 'gerenciamento_republica:login' %}",
        signupUrl: "{% url 'gerenciamento_republica:cadastro' %}",
        signupPageUrl: "{% url 'gerenciamento_republica:cadastro-page' %}",
        redirectUrl: "{% url 'gerenciamento_republica:painel-page' %}"
      };
    </script>
    <script src="{% static 'gerenciamento_republica/js/auth.js' %}"></script>
  </body>
</html>
