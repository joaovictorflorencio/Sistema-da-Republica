{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar - RABBU</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'gerenciamento_republica/css/auth.css' %}" />
  </head>
  <body>
    <div class="auth-container">
      <a class="auth-back-link" href="{% url 'gerenciamento_republica:login-page' %}">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>

      <div class="brand">
        <img src="{% static 'gerenciamento_republica/assets/logo.png' %}" alt="RABBU Logo" class="logo-img" />
      </div>

      <div class="alert-box alert-error" id="globalError">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Erro</span>
      </div>
      <div class="alert-box alert-success" id="globalSuccess">
        <i class="fa-solid fa-circle-check"></i>
        <span id="successText">Sucesso</span>
      </div>

      <div class="form-view active">
        <p class="subtitle">Crie sua conta e escolha como voce quer entrar na plataforma.</p>
        <form id="signupForm">
          <div class="form-group">
            <label>Nome completo</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user icon-left"></i>
              <input
                type="text"
                id="signup-name"
                class="form-control"
                placeholder="Seu nome"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-at icon-left"></i>
              <input
                type="text"
                id="signup-username"
                class="form-control"
                placeholder="Como voce vai entrar"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label>E-mail</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope icon-left"></i>
              <input
                type="email"
                id="signup-email"
                class="form-control"
                placeholder="seu@email.com"
                required
              />
            </div>
          </div>

          <div class="section-title">Republica</div>

          <div class="type-toggle" id="signup-mode-toggle">
            <button type="button" class="toggle-btn active" data-signup-mode="existing">Entrar em uma existente</button>
            <button type="button" class="toggle-btn" data-signup-mode="new">Criar nova republica</button>
          </div>

          <div id="signup-existing-section" class="dynamic-section active">
            <div class="form-group">
              <label>ID da republica</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-house icon-left"></i>
                <input
                  type="number"
                  id="signup-republica"
                  class="form-control"
                  placeholder="Ex: 1"
                  min="1"
                />
              </div>
              <small class="helper-text">Use o ID da republica em que voce vai entrar. Se preferir, mude para criar uma nova.</small>
            </div>
          </div>

          <div id="signup-new-section" class="dynamic-section">
            <div class="form-group">
              <label>Nome da nova republica</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-house-circle-check icon-left"></i>
                <input
                  type="text"
                  id="signup-new-republica-name"
                  class="form-control"
                  placeholder="Ex: Solar 101"
                />
              </div>
            </div>

            <div class="form-group">
              <label>Endereco</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-location-dot icon-left"></i>
                <input
                  type="text"
                  id="signup-new-republica-address"
                  class="form-control"
                  placeholder="Rua, numero, bairro"
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock icon-left"></i>
              <input
                type="password"
                id="signup-password"
                class="form-control"
                placeholder="********"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="toggleVisibility('signup-password', 'signup-eye')"
              >
                <i class="fa-regular fa-eye" id="signup-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirmar senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock icon-left"></i>
              <input
                type="password"
                id="signup-password-confirm"
                class="form-control"
                placeholder="********"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="toggleVisibility('signup-password-confirm', 'signup-eye-confirm')"
              >
                <i class="fa-regular fa-eye" id="signup-eye-confirm"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-main" id="btn-submit-signup">
            <span>Criar conta</span>
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </form>
        <div class="switch-link">
          Ja tem conta?
          <a href="{% url 'gerenciamento_republica:login-page' %}">Entrar agora</a>
        </div>
      </div>
    </div>
    <script>
      window.RABBU_AUTH = {
        loginUrl: "{% url 'gerenciamento_republica:login' %}",
        signupUrl: "{% url 'gerenciamento_republica:cadastro' %}",
        loginPageUrl: "{% url 'gerenciamento_republica:login-page' %}",
        redirectUrl: "{% url 'gerenciamento_republica:painel-page' %}"
      };
    </script>
    <script src="{% static 'gerenciamento_republica/js/auth.js' %}"></script>
  </body>
</html>
